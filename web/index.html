
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Vie Espoir Marketing</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f5;
    }
    header {
      background: #08632e;
      color: white;
      padding: 22px;
      text-align: center;
    }
    h1 { font-size: 25px; }
    .slogan {
      text-align: center;
      color: #08632e;
      font-style: italic;
    }
    .contenu { padding: 15px; }
    .produits {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .produit {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 5px #ccc;
    }
    button, .bouton {
      background: #08632e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .telecharger {
      display: block;
      text-align: center;
      margin: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>🦁 VIE ESPOIR MARKETING</h1>
  <p>Votre boutique en ligne</p>
</header>

<p class="slogan">
  Ensemble pour un meilleur avenir
</p>

<main class="contenu">
  <h2>🛍️ Nos produits</h2>

  <div class="produits" id="produits">
    <p>Chargement des produits...</p>
  </div>
</main>

<div class="telecharger">
  <a class="bouton"
     href="https://github.com/yaoyaoguillaume86-dot/Vie-espoir-Marketing-/releases">
    📲 Télécharger l'application
  </a>
</div>

</body>
</html>
