plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.vieespoir.marketing'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.vieespoir.marketing'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {implementation 'com.google.firebase:firebase-auth:23.2.1'
    implementation 'com.cloudinary:cloudinary-android:3.0.2'

    implementation platform('com.google.firebase:firebase-bom:34.3.0')

    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-analytics'
}
// ========================================================
// LOGO OFFICIEL — VIE ESPOIR MARKETING
// Téléchargement automatique avant compilation
// ========================================================

def logoUrl = 'https://res.cloudinary.com/wxpenkfy/image/upload/v1793664884/509b7a3707733e9c96b64d36d89a0388.png'

tasks.register('installerLogoVieEspoir') {
    doLast {
        def dossier = file('src/main/res/mipmap-hdpi')
        dossier.mkdirs()

        def fichierLogo = new File(dossier, 'ic_launcher.png')

        new URL(logoUrl).withInputStream { input ->
            fichierLogo.withOutputStream { output ->
                output << input
            }
        }

        println 'Logo VIE ESPOIR MARKETING installé !'
    }
}

tasks.named('preBuild') {
    dependsOn('installerLogoVieEspoir')
}