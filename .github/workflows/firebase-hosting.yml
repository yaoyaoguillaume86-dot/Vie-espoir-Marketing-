
name: Publier Vie Espoir Marketing Web

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Installer Firebase CLI
        run: npm install -g firebase-tools

      - name: Publier Vie Espoir Marketing Web
        run: firebase deploy --only hosting --project vie-espoir-marketing --non-interactive
